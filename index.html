<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>29thAvenueDesigns | Studio</title>
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png.jpeg">
    <!-- Rest of your meta/links remain the same -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: #ffffff;
        color: #1a1a1a;
        line-height: 1.5;
    }

    /* Mobile First Navigation */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.2rem;
        background: #ffffff;
        border-bottom: 1px solid #f0f0f0;
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .logo {
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
    }

    .menu-icon {
        font-size: 1.5rem;
        cursor: pointer;
        flex-shrink: 0;
    }

    /* Desktop Navigation */
    .desktop-nav {
        display: flex;
        gap: 2rem;
        align-items: center;
        position: relative;
    }

    .desktop-nav > a, .dropdown-toggle {
        text-decoration: none;
        color: #1a1a1a;
        font-size: 0.85rem; /* Made slightly smaller for a sharper look */
        text-transform: uppercase;
        letter-spacing: 1.5px; /* Increased letter spacing */
        padding: 0.5rem 0;
        position: relative;
        background: transparent;
        border: none;
        font-family: inherit;
        cursor: pointer;
    }

    .dropdown-toggle i {
        margin-left: 5px;
        font-size: 0.75rem;
        transition: transform 0.3s ease;
    }

    .dropdown {
        position: relative;
        display: inline-block;
    }

    .dropdown:hover .dropdown-toggle i {
        transform: rotate(180deg);
    }

    .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        background: #ffffff;
        min-width: 200px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.05); /* Softer, modern shadow */
        border: 1px solid #f5f5f5;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 1000;
        padding: 1rem 0;
    }

    .dropdown:hover .dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    .dropdown-menu a {
        display: block;
        padding: 0.8rem 1.5rem;
        text-decoration: none;
        color: #1a1a1a;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.2s ease;
    }

    .dropdown-menu a:hover {
        background: #fcfcfc;
        color: #b89b7b;
        padding-left: 2rem;
    }

    /* Mobile Menu */
    .mobile-menu {
        position: fixed;
        top: 0;
        left: -100%;
        width: 85%;
        height: 100vh;
        background: #ffffff;
        z-index: 2000;
        padding: 2rem 1.5rem;
        transition: 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        overflow-y: auto;
    }

    .mobile-menu.active {
        left: 0;
    }

    .close-menu {
        text-align: right;
        font-size: 1.5rem;
        margin-bottom: 3rem;
        cursor: pointer;
        color: #1a1a1a;
    }

    .mobile-menu-links {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .mobile-menu-links a {
        text-decoration: none;
        color: #1a1a1a;
        font-size: 1.1rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 1px solid #f5f5f5;
        padding-bottom: 1rem;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(3px); /* Modern blur effect */
        z-index: 1500;
        display: none;
    }

    .overlay.active {
        display: block;
    }

    /* Fading Gallery Section */
    .gallery-section {
        width: 100%;
        padding: 0;
        margin: 0;
        position: relative; /* Added for absolute positioning of CTA */
        overflow: hidden;
    }

    .slideshow-container {
        position: relative;
        width: 100%;
        height: calc(100vh - 60px);
        min-height: 400px;
        overflow: hidden;
    }

    .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 2s ease-in-out;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .slide::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.15); /* Slight dark overlay to make button pop */
        z-index: 1;
    }

    .slide.active {
        opacity: 1;
        z-index: 0;
    }

    /* Slide images */
    .slide-1 { background-image: url('https://poiseonly.github.io/images/IMG_9366.JPG.jpeg'); }
    .slide-2 { background-image: url('https://poiseonly.github.io/images/ABA03F76-E5F0-4C0B-9D76-8D5719B46F5D.CR2'); }
    .slide-3 { background-image: url('https://poiseonly.github.io/images/IMG_9463.JPG.jpeg'); }
    .slide-4 { background-image: url('https://poiseonly.github.io/images/IMG_3290.JPG.jpeg'); }
    .slide-5 { background-image: url('https://poiseonly.github.io/images/IMG_3275.JPG.jpeg'); }
    .slide-6 { background-image: url('https://poiseonly.github.io/images/IMG_3250.JPG.jpeg'); }
    .slide-7 { background-image: url('https://poiseonly.github.io/images/poise4.jpg'); }

    /* --- SHARP "HIRE US NOW" BUTTON --- */
    .hero-cta {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        text-align: center;
    }

    .hire-us-btn {
        display: inline-block;
        padding: 1.2rem 3.5rem;
        border: 1px solid #ffffff;
        color: #ffffff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 0.9rem;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
        transition: all 0.4s ease;
    }

    .hire-us-btn:hover {
        background: #ffffff;
        color: #1a1a1a;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Footer */
    .footer {
        background: #1a1a1a;
        color: #ffffff;
        padding: 3rem 1.5rem;
        text-align: center;
        margin-top: 0;
        width: 100%;
    }

    .footer-logo {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: 0.8rem;
        color: #ffffff;
    }

    .footer-email {
        font-size: 0.95rem;
        color: #b89b7b;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 1.5rem;
        padding-bottom: 3px;
        transition: color 0.3s;
    }
    
    .footer-email:hover {
        color: #ffffff;
    }

    .footer-social {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin: 1.5rem 0;
    }

    .footer-social a {
        color: #ffffff;
        font-size: 1.1rem;
        transition: color 0.3s;
    }
    
    .footer-social a:hover {
        color: #b89b7b;
    }

    .footer-copyright {
        font-size: 0.75rem;
        color: #666;
        margin-top: 2rem;
        letter-spacing: 1px;
    }

    /* Desktop Styles */
    @media (min-width: 768px) {
        .navbar {
            padding: 1.5rem 4rem;
        }
        .logo { font-size: 1.3rem; max-width: none; }
        .menu-icon { display: none; }
        .mobile-menu, .overlay { display: none; }
        .desktop-nav { display: flex !important; gap: 3rem; }
        .slideshow-container { height: calc(100vh - 80px); min-height: 600px; }
        .footer-logo { font-size: 1.8rem; }
        .footer-email { font-size: 1rem; }
    }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">29thAvenueDesigns</div>
        <div class="menu-icon" onclick="openMenu()"><i class="fas fa-bars"></i></div>
        <div class="desktop-nav">
            <a href="/">HOME</a>
            <div class="dropdown">
                <button class="dropdown-toggle">STUDIO <i class="fas fa-chevron-down"></i></button>
                <div class="dropdown-menu">
                    <a href="studio.html">STUDIO</a>
                    <a href="products.html">PRODUCTS</a>
                </div>
            </div>
            <a href="work.html">PORTFOLIO</a>
            <a href="process.html">OUR PROCESS</a>
            <a href="contact.html">CONTACT</a>
        </div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu" onclick="closeMenu()"><i class="fas fa-times"></i></div>
        <div class="mobile-menu-links">
            <a href="/" onclick="closeMenu()">HOME</a>
            <a href="studio.html" onclick="closeMenu()">STUDIO</a>
            <a href="products.html" onclick="closeMenu()">PRODUCTS</a>
            <a href="work.html" onclick="closeMenu()">PORTFOLIO</a>
            <a href="process.html" onclick="closeMenu()">OUR PROCESS</a>
            <a href="contact.html" onclick="closeMenu()">CONTACT</a>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <section class="gallery-section">
        <div class="slideshow-container" id="slideshow">
            <div class="slide slide-1 active"></div>
            <div class="slide slide-2"></div>
            <div class="slide slide-3"></div>
            <div class="slide slide-4"></div>
            <div class="slide slide-5"></div>
            <div class="slide slide-6"></div>
            <div class="slide slide-7"></div>
        </div>
        <!-- NEW BUTTON CTA -->
        <div class="hero-cta">
            <a href="contact.html" class="hire-us-btn">HIRE US NOW</a>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-logo">29thAvenueDesigns</div>
        <a href="mailto:29thavenuedesigns@gmail.com" class="footer-email">29thavenuedesigns@gmail.com</a>
        <p style="font-size: 0.85rem; letter-spacing: 1px; color: #aaa;">LAGOS, NIGERIA</p>
    
        <div class="footer-social">
            <a href="https://www.instagram.com/29thavenuedesigns/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-pinterest"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <div class="footer-copyright">
            ©️ 2026 29thAvenueDesigns STUDIO. ALL RIGHTS RESERVED.
        </div>
    </footer>

    <script>
        function openMenu() {
            document.getElementById('mobileMenu').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }
        function closeMenu() {
            document.getElementById('mobileMenu').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        let slideIndex = 0;
        const slides = document.getElementsByClassName('slide');
        let slideInterval;

        function showSlide(n) {
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove('active');
            }
            slides[n].classList.add('active');
            slideIndex = n;
        }

        function nextSlide() {
            slideIndex = (slideIndex + 1) % slides.length;
            showSlide(slideIndex);
        }

        showSlide(0);
        slideInterval = setInterval(nextSlide, 5000);
    </script>
</body>
</html>
